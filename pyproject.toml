[project]
name = "washday"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-allauth[socialaccount]>=65,<66",
    "django-hijack>=3.7.9,<3.8",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<24",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]
