        <td class="r"><button class="btn small" data-archive="${x.id}">Archive</button></td></tr>`).join("")}
      </tbody></table></div>
      ${st.supplies.some(x=>x.archived) ? `<p class="sample-note" style="margin-top:10px">Archived (kept for old counts and reports): ${st.supplies.filter(x=>x.archived).map(x=>`${esc(x.name)} <button class="btn small" data-restore="${x.id}">Restore</button>`).join(" ")}</p>` : ""}
    </section>
    <section class="card" style="grid-column:1/-1"><div class="screen-head" style="margin-bottom:6px"><div><h3>Piece items</h3><p>Fixed price per piece, not weighed. Add sizes when the price depends on size, for example a king comforter.</p></div><button class="btn primary small" data-addpiece>+ Add piece item</button></div>
      <div class="table-wrap"><table><thead><tr><th>Item</th><th>Size</th><th class="r">Price (₱)</th><th class="r"><span class="sr">Remove</span></th></tr></thead><tbody>
      ${activePieces().map(x => x.variants.map((v,i) => `<tr>
        ${i===0 ? `<td rowspan="${x.variants.length}" style="vertical-align:top"><b>${esc(x.name)}</b><div class="piece-acts"><button class="btn small" data-addvar="${x.id}">+ Size</button><button class="btn small" data-archpiece="${x.id}">Archive</button></div></td>` : ""}<td>${esc(v.label)}</td>
        <td class="r"><input class="count-in" style="width:84px" inputmode="decimal" data-pprice="${x.id}:${v.id}" value="${v.price}" aria-label="Price for ${esc(x.name)} ${esc(v.label)}"></td>
        <td class="r">${x.variants.length>1 ? `<button class="x" style="width:44px;height:44px" data-delvar="${x.id}:${v.id}" aria-label="Remove size ${esc(v.label)}" title="Remove size">×</button>` : ""}</td></tr>`).join("")).join("")}
      </tbody></table></div>
      ${st.pieces.some(x=>x.archived) ? `<p class="sample-note" style="margin-top:10px">Archived: ${st.pieces.filter(x=>x.archived).map(x=>`${esc(x.name)} <button class="btn small" data-restorepiece="${x.id}">Restore</button>`).join(" ")}</p>` : ""}
      <p class="sample-note">Pieces don't count toward the minimum kilos. Existing jobs keep the price they were created with.</p>
    </section>
  </div>
  <div class="reset-row"><button class="btn small" data-reset>Reset sample data</button><span>Puts the prototype back to its starting example data.</span></div>`;
}

/* ---------- Event wiring ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset, dr = ui.draft;
  if (d.view){ ui.view = d.view; return render(); }
  if (t.hasAttribute("data-theme-toggle") || t.hasAttribute("data-darkset")){ theme = theme==="dark" ? "light" : "dark"; try { localStorage.setItem("laundry-theme", theme); } catch(e){} applyTheme(); return render(); }
  if (t.hasAttribute("data-sync")){ ui.online = !ui.online; if (ui.online){ toast("Back online"); scheduleSync(); } else toast("Internet dropped. Keep working; changes are saved on the tablet."); return renderTop(); }
  if (d.tab){ ui.tab = d.tab; render(); return $("#main").focus?.(); }
  if (d.otab){ ui.ownerTab = d.otab; return render(); }
  if (d.ob){ ui.ownerBranch = d.ob; return render(); }
  if (d.lb){ ui.liveBranch = d.lb; return render(); }
  if (d.sb){ ui.staffBranch = d.sb; return render(); }
  if (d.mb){ ui.machBranch = d.mb; return render(); }
  if (t.hasAttribute("data-addcat")) return categoryForm();
  if (d.delcat){ const c = catOf(d.delcat), nm = S.machines.filter(m => !m.removed && m.type===c.id).length, ns = stageList().filter(x => x.cat===c.id).length;
    if (nm || ns) return toast(`${c.name} is used by ${nm} machine${nm===1?"":"s"}${ns?` and ${ns} stage${ns===1?"":"s"}`:""}. Change those first.`);
    return act(`${c.name} category removed`, () => { c.archived = true; emit("settings_changed", {category:c.id}); }); }
  if (d.addmach) return machineForm(d.addmach);
  if (d.mservice){ const m = M(d.mservice); return act(m.outOfService ? `${m.label} back in service` : `${m.label} marked out of service`, () => { m.outOfService = !m.outOfService; emit("machine_changed", {id:m.id, outOfService:m.outOfService}); }); }
  if (d.delmach){ const m = M(d.delmach); if (machineState(m).s!=="idle") return toast(`Unload ${m.label} before removing it`); return act(`${m.label} removed`, () => { m.removed = true; emit("machine_removed", {id:m.id}); }); }
  if (t.hasAttribute("data-addstage")) return stageForm();
  if (d.stup || d.stdown){ const id = d.stup || d.stdown; return act("Stage order changed", () => { moveStage(id, d.stup ? -1 : 1); emit("settings_changed", {stages:true}); }); }
  if (d.delstage){ const x = stageOf(d.delstage), n = S.orders.filter(o => o.status===x.id).length;
    if (n) return toast(`${n} job${n===1?" is":"s are"} in ${x.name}. Move ${n===1?"it":"them"} first.`);
    return act(`${x.name} stage removed`, () => { x.archived = true; emit("settings_changed", {stage:x.id}); }); }
  if (t.hasAttribute("data-addstaff")) return staffForm(null);
  if (d.editstaff) return staffForm(d.editstaff);
  if (d.deactivate){ const x = S.staff.find(y=>y.id===d.deactivate); return act(`${x.name} deactivated`, () => { x.inactive = true; emit("staff_changed", {id:x.id, inactive:true}); }); }
  if (d.reactivate){ const x = S.staff.find(y=>y.id===d.reactivate); if (S.staff.some(y => y!==x && !y.inactive && y.branch===x.branch && y.pin===x.pin)) return toast(`Someone at ${B(x.branch).name} now uses ${x.name}'s PIN. Edit and set a new PIN first.`); return act(`${x.name} reactivated`, () => { x.inactive = false; emit("staff_changed", {id:x.id, inactive:false}); }); }
  // counter
  if (d.svc){ dr.svc = d.svc; return render(); }
  if (d.key){ let v = dr.kg; if (d.key==="back") v = v.slice(0,-1); else if (d.key===".") { if (!v.includes(".")) v = (v||"0")+"."; } else if (v.replace(".","").length < 4 && !(v.includes(".") && v.split(".")[1].length>=1)) v = (v==="0"?"":v)+d.key; dr.kg = v; return refreshCounter(); }
  if (d.addon){ dr.addons = dr.addons.includes(d.addon) ? dr.addons.filter(x=>x!==d.addon) : [...dr.addons, d.addon]; t.setAttribute("aria-pressed", dr.addons.includes(d.addon)); return refreshCounter(); }
  if (d.piece){ const v = Math.max(0, (dr.pieces[d.piece]||0) + Number(d.d)); dr.pieces[d.piece] = v; t.parentElement.querySelector("output").textContent = v; return refreshCounter(); }
  if (d.fee){ dr.fees = dr.fees.includes(d.fee) ? dr.fees.filter(x=>x!==d.fee) : [...dr.fees, d.fee]; t.setAttribute("aria-pressed", dr.fees.includes(d.fee)); return refreshCounter(); }
  if (d.cust){ dr.customerId = d.cust; dr.newName = ""; dr.query = ""; const q=$("#custq"); if (q) q.value=""; return render(); }
  if (t.hasAttribute("data-newcust")){ dr.newName = dr.query.trim(); dr.query = ""; return render(); }
  if (t.hasAttribute("data-clearcust")){ dr.customerId = null; dr.newName = ""; dr.query = ""; return render(); }
  if (d.pay){ dr.pay = d.pay; return refreshCounter(); }
  if (t.hasAttribute("data-create")) return createOrder();
  // orders
  if (d.stub) return showStub(orderBy(ui.branch, d.stub));
  if (d.jview){ ui.jobsView = d.jview; return render(); }
  if (d.jday){ ui.jobsDate = d.jday; ui.jobsQ = ""; return render(); }
  if (d.jobdetail) return showJobDetail(d.jobdetail);
  if (d.logpage){ ui.logPage = Number(d.logpage); return render(); }
  if (d.advance) return advance(d.advance);
  if (d.editstage) return editStage(d.editstage);
  if (d.claim) return claim(d.claim);
  // machines
  if (d.machine) return machineTap(d.machine);
  // supplies
  if (d.transfer) return transfer(d.transfer);
  if (t.hasAttribute("data-savecount")) return saveCount();
  if (t.hasAttribute("data-addsupply")) return supplyForm("");
  if (t.hasAttribute("data-addpiece")) return pieceForm(null);
  if (t.hasAttribute("data-addsvc")) return priceItemForm("svc");
  if (d.adduse) return addonUseForm(d.adduse);
  if (d.deluse){ const [aid, sid] = d.deluse.split(":"), a = S.settings.addons.find(y=>y.id===aid), x = S.settings.supplies.find(y=>y.id===sid); return act(`${a.name} no longer uses ${x.name}`, () => { delete a.use[sid]; emit("settings_changed", {addon:aid}); }); }
  if (t.hasAttribute("data-addaddon")) return priceItemForm("addon");
  if (t.hasAttribute("data-addfee")) return priceItemForm("fee");
  if (d.delfee){ const x = S.settings.fees.find(y=>y.id===d.delfee); return act(`${x.name} removed`, () => { x.archived = true; ui.draft.fees = ui.draft.fees.filter(i=>i!==x.id); emit("settings_changed", {fee:x.id}); }); }
  if (d.restorefee){ const x = S.settings.fees.find(y=>y.id===d.restorefee); return act(`${x.name} restored`, () => { x.archived = false; emit("settings_changed", {fee:x.id}); }); }
  if (d.delsvc){ if (activeServices().length < 2) return toast("Keep at least one service"); const x = S.settings.services.find(y=>y.id===d.delsvc); return act(`${x.name} removed`, () => { x.archived = true; emit("settings_changed", {service:x.id}); }); }
  if (d.restoresvc){ const x = S.settings.services.find(y=>y.id===d.restoresvc); return act(`${x.name} restored`, () => { x.archived = false; emit("settings_changed", {service:x.id}); }); }
  if (d.deladdon){ const x = S.settings.addons.find(y=>y.id===d.deladdon); return act(`${x.name} removed`, () => { x.archived = true; ui.draft.addons = ui.draft.addons.filter(i=>i!==x.id); emit("settings_changed", {addon:x.id}); }); }
  if (d.restoreaddon){ const x = S.settings.addons.find(y=>y.id===d.restoreaddon); return act(`${x.name} restored`, () => { x.archived = false; emit("settings_changed", {addon:x.id}); }); }
  if (d.addvar) return pieceForm(d.addvar);
  if (d.delvar){ const [pid, vid] = d.delvar.split(":"), x = S.settings.pieces.find(y=>y.id===pid), v = x.variants.find(y=>y.id===vid); return act(`${x.name} ${v.label} removed`, () => { x.variants = x.variants.filter(y=>y.id!==vid); emit("settings_changed", {piece:x.id}); }); }
  if (d.archpiece){ const x = S.settings.pieces.find(y=>y.id===d.archpiece); return act(`${x.name} archived`, () => { x.archived = true; emit("settings_changed", {piece:x.id}); }); }
  if (d.restorepiece){ const x = S.settings.pieces.find(y=>y.id===d.restorepiece); return act(`${x.name} restored`, () => { x.archived = false; emit("settings_changed", {piece:x.id}); }); }
  if (t.hasAttribute("data-reqsupply")) return requestSupply();
  if (d.counthist) return countHistory(d.counthist);
  if (d.fulfill){ const r = S.requests.find(x=>x.id===d.fulfill); return supplyForm(r?r.name:"", d.fulfill); }
  if (t.hasAttribute("data-staffsupply")){ S.settings.staffCanAddSupply = !S.settings.staffCanAddSupply; save(); emit("settings_changed", {staffCanAddSupply:S.settings.staffCanAddSupply}); render(); return toast(S.settings.staffCanAddSupply ? "Staff can now add supply types" : "Adding supply types is owner-only"); }
  if (d.archive){ const x = S.settings.supplies.find(y=>y.id===d.archive); return act(`${x.name} archived`, () => { x.archived = true; emit("supply_archived", {id:x.id}); }); }
  if (d.restore){ const x = S.settings.supplies.find(y=>y.id===d.restore); return act(`${x.name} restored`, () => { x.archived = false; emit("supply_restored", {id:x.id}); }); }
  // owner
  if (t.hasAttribute("data-export")) return toast("In the real app this downloads the BIR sales report (.xlsx)");
  if (t.hasAttribute("data-pinmaster")){ S.settings.pin.on = !S.settings.pin.on; save(); emit("settings_changed", {pin:S.settings.pin.on}); render(); return toast(S.settings.pin.on ? "Staff PIN turned on" : "Staff PIN turned off"); }
  if (t.hasAttribute("data-reset")){
    if (t.dataset.armed){ try { localStorage.removeItem(KEY); } catch(e){} S = seed(); ui.draft = freshDraft(); ui.count = {}; render(); return toast("Sample data reset"); }
    t.dataset.armed = "1"; t.textContent = "Tap again to reset"; setTimeout(() => { if (t.isConnected){ delete t.dataset.armed; t.textContent = "Reset sample data"; } }, 3000);
  }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "custq"){ ui.draft.query = t.value; ui.draft.customerId = null; ui.draft.newName = ""; $("#sugg").innerHTML = suggHTML(); const s=$("#summary"); if (s) s.innerHTML = summaryHTML(); }
  if (t.id === "notes") ui.draft.notes = t.value;
  if (t.id === "jobs-q"){ ui.jobsQ = t.value; refreshJobs(); }
  if (t.dataset.count){ ui.count[t.dataset.count] = t.value.replace(/[^\d]/g,""); t.value = ui.count[t.dataset.count]; $("#var-"+t.dataset.count).innerHTML = varHTML(t.dataset.count); }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "jobs-date"){ if (t.value){ ui.jobsDate = t.value; ui.jobsQ = ""; } return render(); }
  if (t.id === "branch"){ ui.logPage = 1; ui.branch = t.value; ui.count = {}; return render(); }
  if (t.dataset.sfield){
    const x = S.settings.supplies.find(y=>y.id===t.dataset.sid), v = t.value.trim()==="" ? 0 : parseFloat(t.value);
    if (!(v >= 0)) { toast("Enter a number"); return render(); }
    if (t.dataset.sfield==="low") x.low = v;
    else { const map = t.dataset.sfield==="wash" ? S.settings.recipe.washLoad : S.settings.recipe.orderReady; if (v) map[x.id] = v; else delete map[x.id]; }
    save(); emit("settings_changed", {supply:x.id}); return toast("Saved");
  }
  if (t.dataset.svcf){
    const x = S.settings.services.find(y=>y.id===t.dataset.sid), f = t.dataset.svcf;
    if (f==="name"){ const v = t.value.trim(); if (!v){ t.value = x.name; return toast("A service needs a name"); } x.name = v; x.short = v; }
    if (f==="mode") x.mode = t.value;
    if (f==="price"){ const v = parseFloat(t.value); if (!(v > 0)){ t.value = x.price; return toast("Enter a price above zero"); } x.price = v; }
    save(); emit("settings_changed", {service:x.id}); return toast("Saved");
  }
  if (t.dataset.stf){
    const x = stageOf(t.dataset.sid);
    if (t.dataset.stf==="name"){ const v = t.value.trim(); if (!v){ t.value = x.name; return toast("A stage needs a name"); } x.name = v; }
    if (t.dataset.stf==="cat") x.cat = t.value;
    save(); emit("settings_changed", {stage:x.id}); return toast("Saved");
  }
  if (t.dataset.stask){ const x = stageOf(t.dataset.stask); x.ask = t.checked; if (!x.ask) x.autoNext = false; save(); render(); return toast("Saved"); }
  if (t.dataset.stsimple){ const x = stageOf(t.dataset.stsimple); x.simple = t.checked; save(); emit("settings_changed", {stage:x.id}); return toast("Saved"); }
  if (t.dataset.branchsimple){ const b = B(t.dataset.branchsimple); return act(t.checked ? `${b.name} switched to simple mode` : `${b.name} switched to full mode`, () => { b.simple = t.checked; emit("branch_mode_changed", {branch:b.id, simple:b.simple}); }); }
  if (t.dataset.stauto){ const x = stageOf(t.dataset.stauto); x.autoNext = t.checked; save(); return toast("Saved"); }
  if (t.dataset.catf){
    const c = catOf(t.dataset.cid), v = t.value.trim();
    if (!v){ t.value = c[t.dataset.catf]; return toast("This can't be empty"); }
    c[t.dataset.catf] = v; save(); emit("settings_changed", {category:c.id}); return toast("Saved");
  }
  if (t.dataset.catwash){ const c = catOf(t.dataset.catwash); c.washSupplies = t.checked; save(); return toast("Saved"); }
  if (t.dataset.mf){
    const m = M(t.dataset.mid);
    if (t.dataset.mf==="label"){ const v = t.value.trim(); if (!v){ t.value = m.label; return toast("A machine needs a label"); } if (branchMachines(m.branch).some(x => x!==m && x.label.toLowerCase()===v.toLowerCase())){ t.value = m.label; return toast(`${v} already exists at this branch`); } m.label = v; }
    if (t.dataset.mf==="type") m.type = t.value;
    save(); emit("machine_changed", {id:m.id}); render(); return toast("Saved");
  }
  if (t.dataset.feef){
    const x = S.settings.fees.find(y=>y.id===t.dataset.fid), f = t.dataset.feef;
    if (f==="name"){ const v = t.value.trim(); if (!v){ t.value = x.name; return toast("A fee needs a name"); } x.name = v; }
    if (f==="note") x.note = t.value.trim();
    if (f==="amount"){ const v = parseFloat(t.value); if (!(v > 0)){ t.value = x.amount; return toast("Enter an amount above zero"); } x.amount = v; }
    save(); emit("settings_changed", {fee:x.id}); return toast("Saved");
  }
  if (t.dataset.addf){
    const x = S.settings.addons.find(y=>y.id===t.dataset.aid), f = t.dataset.addf;
    if (f==="name"){ const v = t.value.trim(); if (!v){ t.value = x.name; return toast("An add-on needs a name"); } x.name = v; }
    if (f==="price"){ const v = parseFloat(t.value); if (!(v > 0)){ t.value = x.price; return toast("Enter a price above zero"); } x.price = v; }
    save(); emit("settings_changed", {addon:x.id}); return toast("Saved");
  }
  if (t.dataset.pprice){
    const [pid, vid] = t.dataset.pprice.split(":"), v = S.settings.pieces.find(y=>y.id===pid).variants.find(y=>y.id===vid), num = parseFloat(t.value);
    if (!(num > 0)){ t.value = v.price; return toast("Enter a price above zero"); }
    v.price = num; save(); emit("settings_changed", {piece:pid}); return toast("Saved");
  }
  if (t.dataset.pinact){ S.settings.pin.actions[t.dataset.pinact] = t.checked; save(); return toast("Saved"); }
  const num = parseFloat(t.value);
  if (t.dataset.set){ if (!(num > 0)){ t.value = S.settings[t.dataset.set]; return toast("Enter a number above zero"); } S.settings[t.dataset.set] = num; save(); emit("settings_changed", {[t.dataset.set]:num}); return toast("Saved"); }
  if (t.dataset.svcprice){ if (!(num > 0)){ t.value = S.settings.services[t.dataset.svcprice].price; return toast("Enter a price above zero"); } S.settings.services[t.dataset.svcprice].price = num; save(); emit("settings_changed", {price:num}); return toast("Saved"); }
});

render();
setInterval(() => {
  if ($("#modal-root").innerHTML) return;
  if (document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return renderTop();
  if ((ui.view==="staff" && (ui.tab==="machines" || ui.tab==="orders")) || (ui.view==="owner" && ui.ownerTab==="live")) render(); else renderTop();
}, 20000);
})();
</script>
