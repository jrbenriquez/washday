<meta charset="utf-8">
<title>Laundry Shop Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Brand: Bula & Banlaw Laundry (generic placeholder) — royal blue, teal, sky blue, white, bubble grey. Layout: tablet-landscape counter app. Left rail of four jobs, big tap targets; owner view is a single dashboard column. Signature: teal claim tags with a punched hole, and porthole machine tiles. */
:root{
  --bg:#E8F5F5; --surface:#FFFFFF; --surface-2:#F0F7F8; --ink:#16246A; --muted:#566284; --line:#CBDFE3;
  --accent:#2537A0; --accent-ink:#FFFFFF; --accent-soft:#E0E6FA;
  --teal:#19B5AF; --sky:#4AA8E0; --bubble:#A9B4C8;
  --tag:#19B5AF; --tag-ink:#0A1F5A;
  --good:#1D7F5C; --good-soft:#D8F0E6; --warn:#A06400; --warn-soft:#FBEACB; --crit:#B83A28; --crit-soft:#F8DDD8;
  --shadow:0 1px 2px rgba(22,36,106,.06),0 6px 20px rgba(22,36,106,.07);
  --f-display:"Saira Condensed","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#0A1230; --surface:#111B44; --surface-2:#172456; --ink:#E6ECFF; --muted:#9DA9CF; --line:#263370;
  --accent:#7D91FF; --accent-ink:#0A1230; --accent-soft:#1E2B6E;
  --teal:#2CC6BF; --sky:#5BB6EC; --bubble:#6F7BA0;
  --tag:#24BDB6; --tag-ink:#03201F;
  --good:#53C08E; --good-soft:#123327; --warn:#E3A93C; --warn-soft:#3A2B0D; --crit:#F07C68; --crit-soft:#3E1C17;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:26px;text-transform:uppercase;letter-spacing:.01em;color:var(--accent)} h3{font-size:16px;font-weight:600}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:44px;height:50px;flex:none;display:block}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;white-space:nowrap;color:var(--accent);text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.brand small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.sync.off .dot{background:var(--warn)}
.sync.off{background:var(--warn-soft);border-color:transparent}

/* Shell */
.shell{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:calc(100% - 66px)}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:12px 8px;
  padding-left:max(8px,env(safe-area-inset-left,0px))}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);min-height:64px}
.rail button svg{width:26px;height:26px}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.rail button[aria-current="page"] svg{color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
main{min-width:0;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell main{padding-left:20px}
.screen-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.screen-head p{margin:2px 0 0;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ink{background:var(--ink);color:var(--surface);border-color:transparent}
.btn.small{min-height:44px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.plain{background:var(--surface-2);color:var(--muted)}

/* Claim tag (signature) */
.tag{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:700;
  padding:4px 10px 4px 22px;border-radius:4px 8px 8px 4px;font-size:14px;line-height:1.2;white-space:nowrap}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.tag.big{font-size:30px;padding:8px 18px 8px 36px;border-radius:6px 14px 14px 6px}
.tag.big::before{left:12px;width:14px;height:14px;margin-top:-7px}

/* Counter */
.counter{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:14px}
.field-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.kg-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:stretch}
.kg-display{border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.kg-display .v{font-family:var(--f-mono);font-size:44px;font-weight:700;line-height:1}
.kg-display .v.empty{color:var(--muted)}
.kg-display .u{font-weight:600;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{min-height:52px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-size:20px;font-weight:700}
.keypad button:active{background:var(--accent-soft)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border:1.5px solid var(--line);border-radius:12px;min-height:56px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl button{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:22px;font-weight:700}
.stepper .ctl output{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 14px;border:1.5px solid var(--line);border-radius:12px;width:100%;text-align:left}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch::after{transform:translateX(22px)}
.input{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.input:focus{border-color:var(--accent);outline:none}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.sugg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.summary{position:sticky;top:84px}
.lines{display:grid;gap:6px;margin:12px 0;padding:12px 0;border-block:1px dashed var(--line)}
.line{display:flex;justify-content:space-between;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.total b{font-family:var(--f-mono);font-size:30px}

/* Orders board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col-head h3{font-size:15px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;box-shadow:var(--shadow)}
.ocard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocard .meta{font-size:13px;color:var(--muted)}
.ocard .open{text-align:left;display:grid;gap:6px;border-radius:8px}
.ocard.old{border-color:var(--warn)}
.empty-col{font-size:13px;color:var(--muted);padding:8px 4px}

/* Machines */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.mtile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px 12px;display:grid;justify-items:center;gap:6px;text-align:center;min-height:186px}
.mtile.run{border-color:var(--accent)}
.mtile.long{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.port{width:96px;height:96px;position:relative}
.port svg{width:100%;height:100%;display:block}
.port .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.drum{transform-origin:50px 50px}
.mtile.run .drum{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mtile .st{font-weight:700;font-size:14px}
.mtile .sub{font-size:12.5px;color:var(--muted);min-height:18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:12px}

.mgrid.compact{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-bottom:16px}
.mgrid.compact .mtile{min-height:0;padding:10px 6px;border-radius:12px}
.mgrid.compact .port{width:64px;height:64px}
.mgrid.compact .port .lbl{font-size:16px}
.mgrid.compact .st{font-size:12.5px}.mgrid.compact .sub{font-size:11.5px}
.live-note{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:14px;margin-bottom:14px}
.live-note .dot{background:var(--good)}
.live-note.stale{background:var(--warn-soft);color:var(--warn)}
.live-note.stale .dot{background:var(--warn)}
.live-kpis .v{font-size:26px}
.card .board{grid-auto-columns:minmax(200px,1fr)}
.piece-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jobs-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.jobs-tools .search{flex:1 1 260px;min-width:0}
.datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.datepick .input{min-height:48px;width:auto;max-width:100%}
.tools-note{margin:0 0 12px;font-size:13px}
.jlist{display:grid;gap:8px}
.jrow{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1.3fr);gap:8px 16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
.jrow:hover{border-color:var(--accent)}
.jrow > span{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.hist-sum{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;font-size:14px}
.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist-row{display:grid;grid-template-columns:auto 12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.hist-row:last-child{border-bottom:0}
.h-time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.h-dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.k-in .h-dot{background:var(--accent)} .k-pay .h-dot{background:var(--good)} .k-out .h-dot{background:var(--teal)} .k-stage .h-dot{background:var(--sky)}
.h-job{border:0;cursor:pointer;min-height:32px}
.tl{list-style:none;margin:0;padding:0 0 0 4px;border-left:2px solid var(--line)}
.tl-row{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;margin-left:-7px;font-size:14px}
.tl-row .h-dot{margin-top:5px;width:12px;height:12px;border:2px solid var(--surface)}
.jd-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jd-sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jd-sum small{display:inline}
@media (max-width:760px){
  .jrow{grid-template-columns:auto minmax(0,1fr)}
  .jr-st,.jr-pay{grid-column:2}
  .hist-row{grid-template-columns:auto 12px minmax(0,1fr)}
  .hist-row .h-job{grid-column:3;justify-self:start}
}
@media (max-width:760px){
  .edit-table thead{display:none}
  .edit-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .edit-table td{border:0;padding:0}
  .edit-table td:first-child{grid-column:1 / -1}
  .edit-table .cell-in{min-width:0}
}
.card-acts{display:flex;gap:6px}
.card-acts .btn:first-child{flex:1}
.icon-btn{width:44px;padding:0;flex:none}
.icon-btn svg{width:18px;height:18px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick button:disabled{opacity:.55;cursor:default}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.staff-list{display:grid}
.staff-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.staff-row:last-child{border-bottom:0}
.staff-row.is-off{opacity:.6}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.staff-main{display:flex;flex-direction:column;min-width:0}
.staff-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:420px){.staff-row{grid-template-columns:40px minmax(0,1fr)}.staff-acts{grid-column:2;justify-content:flex-start}}
.owner-tabs .seg{max-width:100%}
.owner-tabs .seg button{white-space:nowrap}
@media (max-width:520px){.owner-tabs .seg{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:16px}.owner-tabs .seg button{border-radius:12px}}
.mpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:64px}
.mp b{font-family:var(--f-display);font-size:20px}
.mp small{font-size:12px;color:var(--muted)}
.mp:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.mp:disabled{opacity:.5;cursor:not-allowed}
.skip summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center}
.skip[open]{display:grid;gap:10px}
.mtile.oos{opacity:.5}
.mach-list{display:grid}
.cell-in{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.mach-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mach-row.is-off{opacity:.65}
.mach-row .cell-in{min-width:0}
.stage-table .check{min-height:44px}
.nowrap{white-space:nowrap}
@media (max-width:760px){.stage-table tr{grid-template-columns:1fr 1fr}.stage-table td:first-child{grid-column:auto}.mach-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.count-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 0;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.count-row:last-child{border-bottom:0}
.count-hist{display:grid;gap:10px;max-height:60vh;overflow:auto}
.ch-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ch-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ch-lines{display:grid;gap:4px;font-size:14px}
.ch-lines div{display:grid;grid-template-columns:1fr auto 52px;gap:10px}
.ch-lines div span:last-child{text-align:right}
.simple-pill{background:var(--accent-soft);color:var(--accent);vertical-align:middle;font-size:12px}
.log-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.log .log-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.log-what{display:flex;flex-direction:column;min-width:0}
.log-qty{font-weight:700}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.uses{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

<script>
(function(){
"use strict";
const KEY = "laundry-proto-v7";
const MIN = 60000, H = 60*MIN, DAY = 24*H;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => { const v = Math.round(Number(n||0)*100)/100; return "₱" + v.toLocaleString("en-PH", Number.isInteger(v) ? {maximumFractionDigits:0} : {minimumFractionDigits:2, maximumFractionDigits:2}); };
const sod = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const isToday = t => t >= sod();
const fmtTime = t => new Date(t).toLocaleTimeString("en-PH", {hour:"numeric", minute:"2-digit"});
const fmtDate = t => new Date(t).toLocaleDateString("en-PH", {weekday:"short", month:"short", day:"numeric"});
const ago = t => { const m = Math.round((Date.now()-t)/MIN); if (m < 1) return "just now"; if (m < 60) return m+" min ago"; const h = Math.round(m/60); if (h < 24) return h+" h ago"; const d = Math.round(h/24); return d+(d===1?" day":" days")+" ago"; };
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- Sample data (all values are examples) ---------- */
function rng(seed){ return () => (seed = (seed*16807) % 2147483647, (seed-1)/2147483646); }
function seed(){
  const r = rng(20261028), now = Date.now();
  const opened = Math.min(now - 30*MIN, Math.max(sod() + 8*H, now - 9*H));
  const S = {
    settings:{
      pin:{on:true, actions:{order:false, claim:true, count:false, transfer:false, supply:false, override:true}}, pinDefaults2:true, staffCanAddSupply:false,
      minKg:3, loadKg:8, checkMin:90,
      fees:[{id:"rush", name:"Rush", amount:50, note:"Same day"}],
      services:[
        {id:"wdf", name:"Wash, dry & fold", short:"Wash-dry-fold", mode:"kg", price:35},
        {id:"wd", name:"Wash & dry only", short:"Wash & dry", mode:"kg", price:28},
        {id:"load", name:"Per load", short:"Per load", mode:"load", price:180},
        {id:"heavy", name:"Heavy items", short:"Heavy items", mode:"kg", price:70}
      ],
      addons:[
        {id:"cond2", name:"Extra conditioner", price:15, use:{cond:1}},
        {id:"white", name:"Whitening", price:25, use:{bleach:100}},
        {id:"hang", name:"On hangers", price:40, use:{}}
      ],
      pieces:[
        {id:"comf", name:"Comforter", variants:[{id:"single", label:"Single", price:350},{id:"queen", label:"Queen", price:450},{id:"king", label:"King", price:550}]},
        {id:"blnk", name:"Blanket", variants:[{id:"single", label:"Single", price:200},{id:"double", label:"Double", price:250}]},
        {id:"curt", name:"Curtain panel", variants:[{id:"each", label:"Each", price:120}]},
        {id:"pill", name:"Pillow", variants:[{id:"each", label:"Each", price:100}]}
      ],
      supplies:[
        {id:"det", name:"Detergent", unit:"sachets", low:40},
        {id:"cond", name:"Fabric conditioner", unit:"sachets", low:40},
        {id:"bag", name:"Plastic bags", unit:"pcs", low:50},
        {id:"bleach", name:"Color-safe bleach", unit:"ml", low:500}
      ],
      recipe:{washLoad:{det:1, cond:1}, orderReady:{bag:1}},
      categories:[{id:"washer", name:"Washer", short:"W", washSupplies:true},{id:"dryer", name:"Dryer", short:"D", washSupplies:false}],
      stages:[{id:"Received", name:"Received"},{id:"Washing", name:"Washing", ask:true, cat:"washer", autoNext:false, simple:false},{id:"Drying", name:"Drying", ask:true, cat:"dryer", autoNext:true, simple:false},{id:"Folding", name:"Folding", simple:false},{id:"Ready", name:"Ready"}]
    },
    branches:[{id:"b1", name:"[Branch 1]", w:6, d:6},{id:"b2", name:"[Branch 2]", w:5, d:5, simple:true},{id:"b3", name:"[Branch 3]", w:8, d:8}],
    staff:[
      {id:"s1", name:"[Staff 1]", pin:"1111", branch:"b1"},{id:"s2", name:"[Staff 2]", pin:"2222", branch:"b1"},
      {id:"s3", name:"[Staff 3]", pin:"3333", branch:"b2"},{id:"s4", name:"[Staff 4]", pin:"4444", branch:"b2"},
      {id:"s5", name:"[Staff 5]", pin:"5555", branch:"b3"},{id:"s6", name:"[Staff 6]", pin:"6666", branch:"b3"}
    ],
    customers:"ABCDEFGH".split("").map((L,i) => ({id:"c"+L, name:"[Customer "+L+"]", phone:"0917 000 00"+String(11+i)})),
    orders:[], loads:[], stock:{}, stockLog:[], counts:[], events:[], requests:[],
    lastSync:{b1:now, b2:now-6*MIN, b3:now-2*H-10*MIN},
    nextNo:{}
  };
  S.machines = [];
  S.branches.forEach(b => {
    for (let i=1;i<=b.w;i++) S.machines.push({id:b.id+"-W"+i, branch:b.id, type:"washer", label:"W"+i});
    for (let i=1;i<=b.d;i++) S.machines.push({id:b.id+"-D"+i, branch:b.id, type:"dryer", label:"D"+i});
  });
  const stockStart = {b1:{det:118, cond:66, bag:160, bleach:1900}, b2:{det:92, cond:81, bag:120, bleach:1400}, b3:{det:63, cond:88, bag:44, bleach:2300}};
  const plan = ["Claimed","Claimed","Claimed","Claimed","Ready","Ready","Folding","Drying","Washing","Received","Received","ReadyOld"];
  S.branches.forEach((b, bi) => {
    const washers = S.machines.filter(m => m.branch===b.id && m.type==="washer");
    const dryers = S.machines.filter(m => m.branch===b.id && m.type==="dryer");
    let no = 1000*(bi+1) + 31;
    let wi = 0, di = 0;
    const W = () => washers[(wi++) % washers.length], D = () => dryers[(di++) % dryers.length];
    S.stock[b.id] = {...stockStart[b.id]};
    plan.forEach((st, k) => {
      const kg0 = Math.round((3 + r()*6)*10)/10, kg = k === 10 ? 0 : kg0;
      const svc = k % 5 === 3 ? "wd" : (k === 7 ? "load" : "wdf");
      const addons = r() > .65 ? ["cond2"] : [];
      const pieces = k === 5 ? {"comf:queen":1} : (k === 10 ? {"comf:king":1, "pill:each":2} : {});
      const cust = r() > .3 ? S.customers[Math.floor(r()*S.customers.length)].id : null;
      let created, status = st, paidAt = null, pay = null;
      if (st === "Claimed"){ created = sod() - DAY + (9+k)*H; paidAt = Math.min(now - 10*MIN, opened + k*70*MIN); pay = k%2 ? "GCash" : "Cash"; }
      else if (st === "ReadyOld"){ created = now - 3*DAY - 2*H; status = "Ready"; }
      else { created = Math.min(now - 15*MIN, opened + (k-3)*35*MIN); }
      if (st === "Ready" && k === 4){ paidAt = created; pay = "GCash"; }
      const o = makeOrder(S, {branch:b.id, no:String(no++), kg, svc, addons, pieces, fees:k===8 ? ["rush"] : [], customerId:cust, createdAt:created, status, paidAt, pay, by:S.staff.find(s=>s.branch===b.id).name});
      if (status === "Claimed") o.claimedAt = paidAt;
      S.orders.push(o);
      // loads for today's work
      const done = (m, start, mins) => S.loads.push({id:uid(), machine:m.id, branch:b.id, order:o.no, start, end:start+mins*MIN, self:false});
      if (status === "Claimed"){ done(W(), created+10*MIN, 35); done(D(), created+50*MIN, 45); }
      if (["Ready","Folding"].includes(status) && created >= sod()){ const w=W(); done(w, created+10*MIN, 35); done(D(), created+50*MIN, 45); }
      if (status === "Drying"){ done(W(), now-75*MIN, 35); S.loads.push({id:uid(), machine:D().id, branch:b.id, order:o.no, start:now-(18+bi*9)*MIN, end:null, self:false}); }
      if (status === "Washing"){ S.loads.push({id:uid(), machine:W().id, branch:b.id, order:o.no, start:now-(bi===0?104:12+bi*6)*MIN, end:null, self:false}); }
      { const reach = ["Received","Washing","Drying","Folding","Ready","Claimed"].indexOf(status);
        const ol = S.loads.filter(l => l.branch===b.id && l.order===o.no), wl = ol.find(l=>l.machine.includes("-W")), dl = ol.find(l=>l.machine.includes("-D"));
        const lab = l => l.machine.split("-")[1];
        const cap = t => Math.min(t, (o.paidAt && status==="Claimed") ? o.paidAt - 5*MIN : now - 2*MIN);
        o.log = [];
        if (reach >= 1) o.log.push({at: wl ? wl.start : cap(created+10*MIN), to:"Washing", via: wl ? lab(wl)+" started" : null});
        if (reach >= 2) o.log.push({at: dl ? dl.start : cap(created+50*MIN), to:"Drying", via: dl ? lab(dl)+" started" : null});
        if (reach >= 3) o.log.push({at: dl && dl.end ? dl.end : cap(created+95*MIN), to:"Folding", via: dl && dl.end ? lab(dl)+" unloaded" : null});
        if (reach >= 4){ const rAt = cap(created+130*MIN); o.log.push({at: rAt, to:"Ready", via:null});
          Object.entries(S.settings.recipe.orderReady).forEach(([sid,q]) => { S.stock[b.id][sid] -= q; S.stockLog.push({branch:b.id, supply:sid, qty:-q, reason:"Packed", job:o.no, at:rAt}); }); }
        if (o.paidAt) o.paidBy = o.by;
        if (status === "Claimed") o.claimedBy = o.by;
      }
    });
    // earlier completed loads today (previous tickets), for per-machine counts
    [...washers, ...dryers].forEach(m => {
      const n = Math.floor(r()*4) + (m.type==="washer" ? 1 : 0);
      for (let j=0;j<n;j++){
        const start = opened + j*55*MIN + Math.floor(r()*20)*MIN;
        if (start + 50*MIN > now) break;
        S.loads.push({id:uid(), machine:m.id, branch:b.id, order:null, start, end:start+(m.type==="washer"?35:45)*MIN, self:r()>.9});
      }
    });
    // automatic deductions for today's washer loads
    S.loads.filter(l => l.branch===b.id && S.machines.find(m=>m.id===l.machine).type==="washer").forEach(l => {
      Object.entries(S.settings.recipe.washLoad).forEach(([sid,q]) => { S.stock[b.id][sid] -= q; S.stockLog.push({branch:b.id, supply:sid, qty:-q, reason:`${l.machine.split("-")[1]} load${l.self?" (self-service)":""}`, job:l.order||null, at:l.start}); });
    });
    S.stockLog.push({branch:b.id, supply:"det", qty:50, reason:"Received from main", job:null, at:sod()-DAY+8*H});
    S.stockLog.push({branch:b.id, supply:"cond", qty:50, reason:"Received from main", job:null, at:sod()-DAY+8*H});
    S.nextNo[b.id] = no;
  });
  const L = o => Object.fromEntries(Object.entries(o).map(([k,[e,c]]) => [k, {exp:e, cnt:c}]));
  S.counts.push({branch:"b3", at:sod()-4*DAY+21*H, by:"[Staff 5]", partial:false, lines:L({det:[88,88], cond:[70,70], bag:[140,138], bleach:[2400,2400]})});
  S.counts.push({branch:"b2", at:sod()-2*DAY+21*H, by:"[Staff 3]", partial:false, lines:L({det:[64,60], cond:[58,58], bag:[120,120], bleach:[2000,2000]})});
  S.counts.push({branch:"b1", at:sod()-3*H, by:"[Staff 1]", partial:false, lines:L({det:[72,72], cond:[66,66], bag:[150,150], bleach:[2600,2600]})});
  S.counts.push({branch:"b1", at:sod()+8*H, by:"[Staff 2]", partial:true, lines:L({det:[60,59]})});
  return S;
}

function pieceVariant(key, st){
  st = st || S.settings;
  const [pid, vid] = String(key).split(":"), p = st.pieces.find(x=>x.id===pid);
  const v = p && (p.variants||[]).find(x=>x.id===vid);
  if (!v) return null;
  return {name: p.variants.length>1 || v.label!=="Each" ? `${p.name} (${v.label})` : p.name, price:v.price};
}
const pieceCount = pcs => Object.values(pcs||{}).reduce((a,q)=>a+(q||0),0);
const jobSize = o => { const n = pieceCount(o.pieces); return [o.kg>0 ? `${o.kg} kg` : "", n ? `${n} pc${n>1?"s":""}` : ""].filter(Boolean).join(" + ") || "—"; };
function priceLines(S, d){
  const st = S.settings, svc = st.services.find(s => s.id===d.svc);
  const kg = Number(d.kg)||0, lines = [];
  if (svc && kg > 0){
    if (svc.mode === "kg"){ const billKg = Math.max(kg, st.minKg); lines.push({label:`${svc.short} · ${billKg} kg × ${peso(svc.price)}${kg>0 && kg<st.minKg?" (min "+st.minKg+" kg)":""}`, amt:billKg*svc.price}); }
    else { const n = Math.max(1, Math.ceil(kg/st.loadKg)); lines.push({label:`${svc.short} · ${n} load${n>1?"s":""} × ${peso(svc.price)}`, amt:n*svc.price}); }
  }
  (d.addons||[]).forEach(id => { const a = st.addons.find(x=>x.id===id); if (a) lines.push({label:a.name, amt:a.price}); });
  Object.entries(d.pieces||{}).forEach(([key,q]) => { const pv = pieceVariant(key, st); if (pv && q>0) lines.push({label:`${pv.name} × ${q}`, amt:q*pv.price}); });
  (d.fees||[]).forEach(id => { const f = st.fees.find(x=>x.id===id); if (f) lines.push({label:f.name, amt:f.amount}); });
  return lines;
}
function makeOrder(S, o){
  const lines = priceLines(S, o);
  return {id:uid(), branch:o.branch, no:o.no, kg:Number(o.kg), svc:o.svc, addons:o.addons||[], pieces:o.pieces||{}, fees:o.fees||[], customerId:o.customerId||null,
    notes:o.notes||"", lines, total:lines.reduce((a,l)=>a+l.amt,0), status:o.status||"Received", createdAt:o.createdAt||Date.now(),
    paidAt:o.paidAt||null, pay:o.pay||null, claimedAt:null, by:o.by||null};
}

/* ---------- State ---------- */
let S;
function loadState(){ try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return null; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
S = loadState() || seed();
(function migrate(){ S.requests = S.requests || []; if (S.settings.staffCanAddSupply === undefined) S.settings.staffCanAddSupply = false; if (S.settings.pin.actions.supply === undefined) S.settings.pin.actions.supply = true; if (S.settings.pin.actions.override === undefined) S.settings.pin.actions.override = true;
  (S.counts||[]).forEach(c => { if (!c.lines){ c.lines = {}; Object.entries(c.variance||{}).forEach(([k,v]) => c.lines[k] = {exp:null, cnt:null, v}); c.partial = false; delete c.variance; } });
  if (!S.settings.pinDefaults2){ Object.assign(S.settings.pin.actions, {order:false, claim:true, count:false, transfer:false, supply:false, override:true}); S.settings.pinDefaults2 = true; }
  if (!S.settings.categories) S.settings.categories=[{id:"washer", name:"Washer", short:"W", washSupplies:true},{id:"dryer", name:"Dryer", short:"D", washSupplies:false}];
  (S.settings.stages||[]).forEach((x,i,a) => { if (x.simple === undefined && i>0 && i<a.length-1) x.simple = false; });
  if (!S.settings.stages) S.settings.stages=[{id:"Received", name:"Received"},{id:"Washing", name:"Washing", ask:true, cat:"washer", autoNext:false},{id:"Drying", name:"Drying", ask:true, cat:"dryer", autoNext:true},{id:"Folding", name:"Folding"},{id:"Ready", name:"Ready"}];
  if (!S.settings.fees){ S.settings.fees = [{id:"rush", name:"Rush", amount:S.settings.rushFee||50, note:"Same day"}]; delete S.settings.rushFee; delete S.settings.selfPrice; save(); } if (!S.settings.checkMin) S.settings.checkMin = 90;
  const ps = S.settings.pieces||[];
  if (ps.some(x => !x.variants)){
    const legacy = ps.length===2 && ps[0].id==="comf" && ps[0].price===150 && ps[1].id==="curt";
    S.settings.pieces = legacy ? [
        {id:"comf", name:"Comforter", variants:[{id:"single", label:"Single", price:350},{id:"queen", label:"Queen", price:450},{id:"king", label:"King", price:550}]},
        {id:"blnk", name:"Blanket", variants:[{id:"single", label:"Single", price:200},{id:"double", label:"Double", price:250}]},
        {id:"curt", name:"Curtain panel", variants:[{id:"each", label:"Each", price:120}]},
        {id:"pill", name:"Pillow", variants:[{id:"each", label:"Each", price:100}]}
      ] : ps.map(x => x.variants ? x : {id:x.id, name:x.name, variants:[{id:"each", label:"Each", price:x.price}]});
    if (!S.settings.services.some(x=>x.id==="heavy")) S.settings.services.push({id:"heavy", name:"Heavy items", short:"Heavy items", mode:"kg", price:70});
    save();
  }
})();

/* ---------- Events, sync, undo ---------- */
let syncTimer = null;
function emit(type, data, who){
  S.events.push({id:uid(), type, branch:ui.branch, at:Date.now(), by:who||null, data, synced:false});
  scheduleSync();
}
function scheduleSync(){
  clearTimeout(syncTimer);
  if (!ui.online || !pending()) return;
  syncTimer = setTimeout(() => {
    const n = pending();
    if (!n || !ui.online) return;
    S.events.forEach(e => e.synced = true);
    S.lastSync[ui.branch] = Date.now();
    save(); renderTop();
    if (n > 1) toast(`Synced ${n} changes`);
  }, 1400);
}
function act(label, fn, opts={}){
  const before = JSON.stringify(S);
  fn();
  save(); render();
  toast(label, opts.undo === false ? null : () => { S = JSON.parse(before); save(); render(); toast("Undone"); });
}
function deduct(branch, use, reason, job){
  Object.entries(use||{}).forEach(([sid,q]) => {
    const sup = S.settings.supplies.find(x => x.id===sid); if (!sup || sup.archived || !q) return;
    S.stock[branch][sid] = (S.stock[branch][sid]||0) - q;
    S.stockLog.push({branch, supply:sid, qty:-q, reason, job:job||null, at:Date.now()});
  });
}

/* ---------- PIN ---------- */
function withPin(action, title, cb){
  const p = S.settings.pin;
  if (!p.on || !p.actions[action]) return cb(null);
  let digits = "";
  const staffHere = S.staff.filter(s => s.branch===ui.branch && !s.inactive);
  openModal(`
    <div class="modal-head"><div><div class="eyebrow">Staff PIN</div><h2>${esc(title)}</h2></div><button class="x" data-close aria-label="Close">×</button></div>
    <p class="muted" style="margin:0 0 6px;text-align:center">Enter your 4-digit PIN to record who did this.</p>
    <div class="pin-dots" id="pin-dots">${"<i></i>".repeat(4)}</div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}<button data-pin="clear" aria-label="Clear">C</button><button data-pin="0">0</button><button data-pin="back" aria-label="Delete">⌫</button></div>
    <p class="sample-note" style="text-align:center">Sample PINs at this branch: ${staffHere.map(s=>`${esc(s.name)} ${s.pin}`).join(" · ")}</p>`,
    (root) => {
      root.addEventListener("click", e => {
        const b = e.target.closest("[data-pin]"); if (!b) return;
        const v = b.dataset.pin;
        if (v === "clear") digits = ""; else if (v === "back") digits = digits.slice(0,-1); else if (digits.length < 4) digits += v;
        $("#pin-err").textContent = "";
        [...$("#pin-dots").children].forEach((d,i) => d.classList.toggle("on", i < digits.length));
        if (digits.length === 4){
          const who = S.staff.find(s => s.pin===digits && s.branch===ui.branch && !s.inactive);
          if (who){ closeModal(); cb(who); }
          else { $("#pin-err").textContent = "PIN not recognized at this branch. Try again."; const dots=$("#pin-dots"); dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake"); digits = ""; setTimeout(()=>[...dots.children].forEach(d=>d.classList.remove("on")), 250); }
        }
      });
    });
}

/* ---------- Modal + toast ---------- */
let lastFocus = null;
function openModal(html, wire){
  lastFocus = document.activeElement;
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const modal = $(".modal", root);
  root.onclick = e => { if (e.target.matches("[data-overlay]") || e.target.closest("[data-close]")) closeModal(); };
  if (wire) wire(modal);
  const f = modal.querySelector("button:not([data-close]), input"); if (f) f.focus();
}
function closeModal(){ $("#modal-root").innerHTML = ""; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal(); });
let toastTimer;
function toast(msg, undo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button type="button">Undo</button>':""}`;
  t.hidden = false;
  if (undo) t.querySelector("button").onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, undo ? 6000 : 2600);
}

function createOrder(){
  const d = ui.draft;
  withPin("order", `Create job #${S.nextNo[ui.branch]}`, who => {
    let o;
    act(`Job #${S.nextNo[ui.branch]} created`, () => {
      let cid = d.customerId;
      if (!cid && d.newName){ cid = "c"+uid(); S.customers.push({id:cid, name:d.newName, phone:""}); }
      const no = String(S.nextNo[ui.branch]++);
      o = makeOrder(S, {branch:ui.branch, no, kg:d.kg, svc:d.svc, addons:d.addons, pieces:d.pieces, fees:d.fees, customerId:cid, notes:d.notes, by:who&&who.name,
        paidAt:d.pay!=="later"?Date.now():null, pay:d.pay!=="later"?d.pay:null});
      if (o.paidAt) o.paidBy = who&&who.name;
      S.orders.push(o);

/* ----- Job list, history and timeline ----- */
function logStage(o, to, via){ (o.log = o.log || []).push({at:Date.now(), to, via}); }
const isoDay = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dayRange = iso => { const [y,m,d] = iso.split("-").map(Number), a = new Date(y, m-1, d).getTime(); return [a, a+DAY]; };
const fmtDT = t => `${fmtDate(t)}, ${fmtTime(t)}`;
const dayLabel = iso => iso===isoDay(Date.now()) ? "today" : iso===isoDay(Date.now()-DAY) ? "yesterday" : fmtDate(dayRange(iso)[0]);
function jobTimeline(o){
  const svc = S.settings.services.find(s=>s.id===o.svc), ev = [];
  ev.push({at:o.createdAt, kind:"in", label:"Received", detail:`${jobSize(o)}${o.kg>0 && svc ? " · "+svc.short : o.kg>0 ? "" : " · pieces only"} · ${peso(o.total)}`, by:o.by});
  S.loads.filter(l => l.branch===o.branch && l.order===o.no).forEach(l => {
    const m = M(l.machine), kind = (catOf(m.type) || {name:"Machine"}).name;
    ev.push({at:l.start, kind:"load", label:`${kind} ${m.label} loaded`, detail:"", by:null});
    if (l.end) ev.push({at:l.end, kind:"load", label:`${kind} ${m.label} unloaded`, detail:`after ${dur(Math.round((l.end-l.start)/MIN))}`, by:null});
  });
  (o.log||[]).forEach(x => ev.push({at:x.at, kind:"stage", label: x.override ? `Stage changed to ${stageName(x.to)}` : `Moved to ${stageName(x.to)}`, detail: x.override ? `manual override from ${stageName(x.from)}${x.reason?" · "+x.reason:""}` : x.skipped ? `no machine recorded · ${x.reason}` : x.via ? (/started$/.test(x.via) ? `in ${x.via.replace(/ started$/,"")}` : `automatic when ${x.via}`) : "", by:x.by||null}));
  if (o.paidAt) ev.push({at:o.paidAt, kind:"pay", label:`Paid ${peso(o.total)}`, detail:`${o.pay}${o.payRef?" · ref "+o.payRef:""}${o.paidAt-o.createdAt < 2*MIN ? " · at drop-off" : ""}`, by:o.paidBy||null});
  if (o.claimedAt) ev.push({at:o.claimedAt, kind:"out", label:"Released to customer", detail:"", by:o.claimedBy||null});
  const rank = {in:0, load:1, stage:2, pay:3, out:4};
  const now = Date.now();
  return ev.filter(e => e.at <= now).sort((a,b) => a.at-b.at || rank[a.kind]-rank[b.kind]);
}
function jobMatches(o, q){
  if (!q) return true;
  const c = o.customerId && cust(o.customerId);
  const hay = [o.no, c && c.name, c && c.phone && c.phone.replace(/\s/g,""), o.notes, o.status==="Claimed" ? "released" : stageName(o.status), o.pay].filter(Boolean).join(" ").toLowerCase();
  const n = q.toLowerCase().replace(/^#/,"").trim();
  return hay.includes(n) || hay.includes(n.replace(/\s/g,""));
}
function statusChip(o){ return o.status==="Claimed" ? '<span class="pill plain">Released</span>' : `<span class="pill ${o.status==="Ready"?"good":"plain"}">${esc(stageName(o.status))}</span>`; }
function payText(o){ return o.paidAt ? `<span class="pill good">Paid · ${esc(o.pay)}</span><small class="muted">${peso(o.total)} · ${fmtDT(o.paidAt)}</small>` : `<span class="pill warn">Unpaid</span><small class="muted">${peso(o.total)} due</small>`; }
function jobsNote(){ return ui.jobsQ.trim() ? "Searching all dates." : `Showing ${dayLabel(ui.jobsDate)}.`; }
function jobsToolbar(){
  const today = isoDay(Date.now()), yest = isoDay(Date.now()-DAY);

    <div class="datebar">

      <button class="chip" data-jday="${yest}" aria-pressed="${ui.jobsDate===yest}">Yesterday</button>

    </div>

function jobListRows(){
  const [a,z] = dayRange(ui.jobsDate), q = ui.jobsQ.trim(), inDay = t => t && t>=a && t<z;
  const list = S.orders.filter(o => o.branch===ui.branch && (q ? jobMatches(o, q) : (inDay(o.createdAt) || inDay(o.claimedAt) || inDay(o.paidAt))))
    .sort((x,y) => Math.max(y.createdAt, y.claimedAt||0) - Math.max(x.createdAt, x.claimedAt||0));
  if (!list.length) return `<div class="empty-col">${q ? `No jobs match “${esc(q)}”.` : "No jobs received, paid or released on this day."}</div>`;
  return list.map(o => { const c = o.customerId && cust(o.customerId), svc = S.settings.services.find(s=>s.id===o.svc);
    return `<button class="jrow" data-jobdetail="${o.no}" aria-label="Open history for job ${o.no}">
      <span class="jr-id"><span class="tag">#${esc(o.no)}</span></span>
      <span class="jr-who"><b>${c?esc(c.name):"Walk-in"}</b><small class="muted">${jobSize(o)}${o.kg>0 && svc ? " · "+esc(svc.short) : ""}${feeNames(o)?" · "+esc(feeNames(o)):""}</small></span>
      <span class="jr-st">${statusChip(o)}<small class="muted">In ${fmtDT(o.createdAt)}${o.claimedAt?` · Out ${fmtDT(o.claimedAt)}`:""}</small></span>
      <span class="jr-pay">${payText(o)}</span>
    </button>`; }).join("");
}
function historyRows(){
  const [a,z] = dayRange(ui.jobsDate), q = ui.jobsQ.trim();
  let rows = [];
  S.orders.filter(o => o.branch===ui.branch && (!q || jobMatches(o, q))).forEach(o => jobTimeline(o).forEach(e => rows.push({...e, o})));
  if (!q){
    S.loads.filter(l => l.branch===ui.branch && l.self && l.amount).forEach(l => rows.push({at:l.start, kind:"pay", label:`Self-service ${M(l.machine).label}`, detail:`${peso(l.amount)} · ${l.pay}`, amount:l.amount, pay:l.pay, o:null}));
    rows = rows.filter(r => r.at>=a && r.at<z);
  }
  rows.sort((x,y) => y.at-x.at);
  let summary = "";
  if (!q){
    const pays = rows.filter(r => r.kind==="pay").map(r => r.o ? {amt:r.o.total, pay:r.o.pay} : {amt:r.amount, pay:r.pay});
    const sum = m => pays.filter(x => !m || x.pay===m).reduce((s,x) => s+x.amt, 0);
    summary = `<div class="hist-sum"><span><b>${rows.filter(r=>r.kind==="in").length}</b> received</span><span><b>${rows.filter(r=>r.kind==="out").length}</b> released</span><span><b>${peso(sum())}</b> collected · Cash ${peso(sum("Cash"))} · GCash ${peso(sum("GCash"))}</span></div>`;
  }
  if (!rows.length) return summary + `<div class="empty-col">${q ? `No events match “${esc(q)}”.` : "No events on this day."}</div>`;
  return summary + `<ol class="hist">${rows.map(r => `<li class="hist-row k-${r.kind}">
      <span class="h-time mono">${q ? fmtDT(r.at) : fmtTime(r.at)}</span>
      <span class="h-dot" aria-hidden="true"></span>
      <span class="h-main"><b>${esc(r.label)}</b>${r.detail?` <span class="muted">· ${esc(r.detail)}</span>`:""}${r.by?`<small class="muted"> · by ${esc(r.by)}</small>`:""}</span>
      ${r.o ? `<button class="tag h-job" data-jobdetail="${r.o.no}" aria-label="Open job ${r.o.no}">#${esc(r.o.no)}</button>` : "<span></span>"}
    </li>`).join("")}</ol>`;
}

/* ----- Stages and machine categories ----- */
const CAT_COLORS = ["var(--accent)","var(--sky)","var(--teal)","var(--warn)","var(--good)","var(--muted)"];
const cats = () => S.settings.categories.filter(c => !c.archived);
const catOf = id => S.settings.categories.find(c => c.id===id);
const catColor = id => CAT_COLORS[Math.max(0, S.settings.categories.findIndex(c => c.id===id)) % CAT_COLORS.length];
const stageList = () => S.settings.stages.filter(s => !s.archived);
const stageIds = () => stageList().map(s => s.id);
const stageOf = id => S.settings.stages.find(s => s.id===id);
const stageName = id => id==="Claimed" ? "Released" : (stageOf(id) || {name:id}).name;
const isSimple = bid => !!(B(bid) || {}).simple;
const visibleStageIds = bid => { const l = stageList(); return isSimple(bid) ? l.filter((x,i) => i===0 || i===l.length-1 || x.simple).map(x => x.id) : l.map(x => x.id); };
const shownIn = (o, bid) => { const vis = visibleStageIds(bid); if (vis.includes(o.status)) return o.status; const i = stageIdx(o.status); return vis.filter(v => stageIdx(v) <= i).at(-1) || vis[0]; };
const nextFor = o => { const vis = visibleStageIds(o.branch), i = stageIdx(o.status); return vis.find(v => stageIdx(v) > i) || null; };
const nextStage = id => { const ids = stageIds(), i = ids.indexOf(id); return i>=0 && i<ids.length-1 ? ids[i+1] : null; };
const stageIdx = id => stageIds().indexOf(id);
const branchMachines = (branch, catId) => S.machines.filter(m => m.branch===branch && !m.removed && (!catId || m.type===catId));
const openLoads = o => S.loads.filter(l => l.branch===o.branch && l.order===o.no && l.end===null);
function endOpenLoads(o){ openLoads(o).forEach(l => { l.end = Date.now(); }); }
function startLoad(m, o){
  S.loads.push({id:uid(), machine:m.id, branch:m.branch, order:o ? o.no : null, start:Date.now(), end:null, self:!o});
  const c = catOf(m.type);
  if (c && c.washSupplies) deduct(m.branch, S.settings.recipe.washLoad, `${m.label} load${o?"":" (self-service)"}`, o ? o.no : null);
}
function moveJob(o, to, extra){
  extra = extra || {};
  const reachedReady = (o.log||[]).some(x => x.to==="Ready");
  if (to !== o.status) endOpenLoads(o);
  o.status = to;
  (o.log = o.log || []).push({at:Date.now(), to, via:extra.via||null, skipped:!!extra.skipped, reason:extra.reason||"", by:extra.by||null});
  if (to==="Ready" && !reachedReady) deduct(o.branch, S.settings.recipe.orderReady, "Packed", o.no);
}

function moveStage(id, dir){

  const a = arr.indexOf(live[i]), b = arr.indexOf(live[j]); [arr[a], arr[b]] = [arr[b], arr[a]];

/* ----- Machines ----- */
function machineState(m, at){
  at = at || Date.now();
  const l = S.loads.find(x => x.machine===m.id && x.start<=at && (x.end===null || x.end>at)); if (!l) return {s:"idle"};
  const mins = Math.floor((at-l.start)/MIN);
  return {s:"run", long: mins >= S.settings.checkMin, mins, l};
}
const isLong = m => machineState(m).long;
const dur = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`;

  return `<div class="screen-head"><div><h2>Machines</h2><p>Tap an idle machine when you load it, and tap it again when you take the laundry out. The time shown is how long it has been in use.</p></div><span class="pill plain">${loadsToday} loads today</span></div>
    <div class="legend"><span>● Idle</span><span style="color:var(--accent)">● Running</span><span style="color:var(--warn)">● In use over ${dur(S.settings.checkMin)}, check it</span></div>
    ${cats().map(section).join("")}`;
}
function tile(m, ro, at){
  const st = machineState(m, at), C = 2*Math.PI*44;
  const ring = st.s==="idle" ? 0 : 1;
  const color = st.long ? "var(--warn)" : "var(--accent)";
  const o = st.l && st.l.order ? `#${st.l.order}` : (st.l && st.l.self ? "Self-service" : "");
  const count = S.loads.filter(l => l.machine===m.id && isToday(l.start)).length;
  const oos = m.outOfService && st.s==="idle";
  const tagName = ro || oos ? "div" : "button";
  return `<${tagName} class="mtile ${st.s}${st.long?" long":""}${oos?" oos":""}" ${ro?"":`data-machine="${m.id}"`} aria-label="${m.label}, ${st.s==="idle"?"idle":"in use for "+dur(st.mins)}">
    <div class="port"><svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="7"/>
      ${ring?`<circle cx="50" cy="50" r="44" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*ring} ${C}" transform="rotate(-90 50 50)"/>`:""}
      <circle cx="50" cy="50" r="33" fill="var(--surface-2)" stroke="var(--line)"/>
      <g class="drum"><circle cx="50" cy="50" r="26" fill="none" stroke="${st.s==="idle"?"var(--line)":color}" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/></g>
    </svg><span class="lbl">${m.label}</span></div>
    <span class="st">${st.s==="idle"?(oos?"Out of service":"Idle"):`In use · ${dur(st.mins)}`}</span>
    <span class="sub">${st.s==="idle" ? `${count} load${count===1?"":"s"} today` : `${o?o+" · ":""}since ${fmtTime(st.l.start)}`}</span>
  </${tagName}>`;
}

    root => root.addEventListener("click", e => {
      const ob = e.target.closest("[data-startorder]"), sb = e.target.closest("[data-startself]");

const lineVar = l => l.v ?? (l.cnt - l.exp);
const countMismatches = c => Object.entries(c.lines).filter(([,l]) => lineVar(l));
const supName = sid => (S.settings.supplies.find(s=>s.id===sid)||{name:sid}).name;
const dayOf = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function countStatus(bid){
  const full = S.counts.filter(c => c.branch===bid && !c.partial).slice(-1)[0];
  const today = S.counts.filter(c => c.branch===bid && c.at >= sod());
  if (!full) return {k:"crit", label:"No full count yet", full, today};
  const days = Math.round((sod() - dayOf(full.at))/DAY);
  const when = days===0 ? "Today "+fmtTime(full.at) : days===1 ? "Yesterday "+fmtTime(full.at) : days+" days ago";
  return {k: days<=1 ? "good" : days===2 ? "warn" : "crit", label:"Full count "+when, full, today};
}
function countHistory(bid){
  const list = S.counts.filter(c => c.branch===bid).slice().reverse().slice(0,15);
  openModal(`<div class="modal-head"><div><div class="eyebrow">${esc(B(bid).name)}</div><h2>Stock counts</h2></div><button class="x" data-close aria-label="Close">×</button></div>
    <p class="muted" style="margin:0 0 10px;font-size:14px">Newest first. Each difference was written to the stock ledger as a count adjustment, so stock now matches what was counted.</p>
    <div class="count-hist">${list.map(c => { const n = Object.keys(c.lines).length, mm = countMismatches(c).length; return `<div class="ch-item">
      <div class="ch-top"><b>${fmtDT(c.at)}</b><span class="pill ${c.partial?"plain":"good"}">${c.partial?`Partial · ${n} item${n===1?"":"s"}`:"Full"}</span>${mm?`<span class="pill warn">${mm} mismatch${mm>1?"es":""}</span>`:""}<small class="muted">${esc(c.by||"no PIN")}</small></div>
      <div class="ch-lines">${Object.entries(c.lines).map(([sid,l]) => { const v = lineVar(l); return `<div><span>${esc(supName(sid))}</span><span class="mono">${l.exp==null?"":`${l.exp} → ${l.cnt}`}</span><span class="mono" style="color:${v?(Math.abs(v)>3?"var(--crit)":"var(--warn)"):"var(--good)"}">${v?(v>0?"+":"")+v:"✓"}</span></div>`; }).join("")}</div></div>`; }).join("") || '<span class="muted">No counts yet.</span>'}</div>`);
}
function varHTML(sid){ const c = ui.count[sid]; if (c===undefined || c==="") return "—"; const d = Number(c) - (S.stock[ui.branch][sid]||0); return d===0 ? '<span class="pill good">Matches</span>' : `<span class="pill ${Math.abs(d)>3?"crit":"warn"}">${d>0?"+":""}${d}</span>`; }
function transfer(sid){
  const s = S.settings.supplies.find(x=>x.id===sid);
  openModal(`<div class="modal-head"><div><div class="eyebrow">Transfer from main stock</div><h2>Receive ${esc(s.name)}</h2></div><button class="x" data-close aria-label="Close">×</button></div>
    <label class="eyebrow" for="tq">Quantity (${s.unit})</label><input class="input" id="tq" inputmode="numeric" style="margin:8px 0 14px">
    <button class="btn primary block" data-ok>Add to ${esc(B(ui.branch).name)} stock</button>`, root => root.addEventListener("click", e => {
      if (!e.target.closest("[data-ok]")) return;
      const q = parseInt($("#tq").value, 10);
      if (!(q > 0)) { $("#tq").focus(); $("#tq").style.borderColor = "var(--crit)"; return; }
      closeModal();
      withPin("transfer", `Receive ${q} ${s.unit}`, who => act(`Received ${q} ${s.unit} of ${s.name}`, () => {
        S.stock[ui.branch][sid] += q; S.stockLog.push({branch:ui.branch, supply:sid, qty:q, reason:"Received from main", at:Date.now()});
        emit("stock_received", {supply:sid, qty:q}, who&&who.name);
      }));
    }));
}
function saveCount(){
  const all = activeSupplies(), filled = all.filter(s => ui.count[s.id]!==undefined && String(ui.count[s.id]).trim()!=="");
  if (!filled.length){ toast("Type at least one counted amount"); const el = $("#cnt-"+all[0].id); if (el) el.focus(); return; }
  const bad = filled.find(s => !/^\d+$/.test(String(ui.count[s.id]).trim()));
  if (bad){ toast(`Check the amount for ${bad.name.toLowerCase()}`); $("#cnt-"+bad.id).focus(); return; }
  const partial = filled.length < all.length;
  withPin("count", partial ? `Save partial count (${filled.length} of ${all.length})` : "Save full stock count", who => act(partial ? `Partial count saved (${filled.length} of ${all.length})` : "Full count saved", () => {
    const lines = {}, at = Date.now();
    filled.forEach(s => { const c = Number(ui.count[s.id]), e = S.stock[ui.branch][s.id]||0; lines[s.id] = {exp:e, cnt:c}; if (c!==e) S.stockLog.push({branch:ui.branch, supply:s.id, qty:c-e, reason:partial?"Count adjustment (partial)":"Count adjustment", at}); S.stock[ui.branch][s.id] = c; });
    S.counts.push({branch:ui.branch, at, by:who&&who.name, partial, lines});
    emit("stock_counted", {partial, lines}, who&&who.name);
    ui.count = {};
  }));
}

      });

}

        if (!x && !pin) return err("Set a 4-digit PIN, or tap Generate.");
        if (pin && !/^\d{4}$/.test(pin)) return err("The PIN must be exactly 4 digits.");
        const usePin = pin || x.pin;
        if (S.staff.some(y => y!==x && !y.inactive && y.branch===branch && y.pin===usePin)) return err(`Someone at ${B(branch).name} already uses that PIN. Pick another.`);
        if (S.staff.some(y => y!==x && y.branch===branch && y.name.toLowerCase()===name.toLowerCase())) return err(`${name} is already listed at ${B(branch).name}.`);
        closeModal();
        act(x ? `${name} updated${pin?" · new PIN set":""}` : `${name} added to ${B(branch).name}`, () => {
          if (x){ x.name = name; x.branch = branch; if (pin) x.pin = pin; }
          else S.staff.push({id:"s"+uid(), name, branch, pin});
          emit("staff_changed", {name, branch});
        });
        if (pin) setTimeout(() => toast(`PIN for ${name}: ${pin}. Share it with them privately.`), 2500);
      });
      root.querySelector("#st-pin").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,4); });
    });
}

function categoryForm(){
  openModal(`<div class="modal-head"><div><div class="eyebrow">All branches</div><h2>Add machine category</h2></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="stack">

function dashView(){
  const ids = ui.ownerBranch==="all" ? S.branches.map(b=>b.id) : [ui.ownerBranch];
  const inB = x => ids.includes(x.branch);
  const loads = S.loads.filter(l => inB(l) && isToday(l.start));
  const kg = S.orders.filter(o => inB(o) && isToday(o.createdAt)).reduce((a,o)=>a+o.kg,0);
  const paid = S.orders.filter(o => inB(o) && o.paidAt && isToday(o.paidAt));
  const selfSales = loads.filter(l => l.self && l.amount);
  const cash = paid.filter(o=>o.pay==="Cash").reduce((a,o)=>a+o.total,0) + selfSales.filter(l=>l.pay==="Cash").reduce((a,l)=>a+l.amount,0);
  const gcash = paid.filter(o=>o.pay==="GCash").reduce((a,o)=>a+o.total,0) + selfSales.filter(l=>l.pay==="GCash").reduce((a,l)=>a+l.amount,0);
  const ready = S.orders.filter(o => inB(o) && o.status==="Ready");
  const running = S.machines.filter(m => inB(m) && activeLoad(m.id)).length, total = S.machines.filter(inB).length;
  const max = Math.max(1, ...S.machines.filter(inB).map(m => loads.filter(l=>l.machine===m.id).length));
  const alerts = [];
  ids.forEach(bid => {
    const bn = B(bid).name;
    activeSupplies().forEach(s => { if ((S.stock[bid][s.id]||0) <= s.low) alerts.push(["crit", `<b>${esc(s.name)}</b> is low at ${esc(bn)}: ${S.stock[bid][s.id]} ${s.unit} left.`]); });
    const bc = S.counts.filter(c => c.branch===bid), recent = bc.filter(c => c.at >= sod()-DAY);
    (recent.length ? recent : bc.slice(-1)).forEach(c => countMismatches(c).forEach(([sid,l]) => { const v = lineVar(l); alerts.push(["warn", `Count mismatch at ${esc(bn)}: <b>${esc(supName(sid))}</b> ${v>0?"+":""}${v} vs expected (${c.partial?"partial count, ":""}${fmtDT(c.at)}, ${esc(c.by||"no PIN")}).`]); }));
    S.orders.filter(o => o.branch===bid && o.status==="Ready" && Date.now()-o.createdAt>2*DAY).forEach(o => alerts.push(["warn", `Job <b>#${o.no}</b> at ${esc(bn)} has been ready ${ago(o.createdAt).replace(" ago","")}${o.paidAt?"":" and is unpaid"}.`]));
    S.requests.filter(r => r.branch===bid && !r.done).forEach(r => alerts.push(["info", `Supply request from ${esc(bn)}: <b>${esc(r.name)}</b>${r.note?` (${esc(r.note)})`:""}. <button class=\"btn small\" data-fulfill=\"${r.id}\" style=\"margin-top:6px\">Add as supply type</button>`]));
    const since = Date.now() - S.lastSync[bid];
    if (since > 30*MIN) alerts.push(["info", `${esc(bn)} last synced ${ago(S.lastSync[bid])}. Its tablet keeps working offline; numbers here update when it reconnects.`]);
  });
  return `<div class="screen-head"><div><h2>Today across ${ui.ownerBranch==="all"?"all branches":esc(B(ui.ownerBranch).name)}</h2><p>${fmtDate(Date.now())} · sample data</p></div>
    <div class="chips"><button class="chip" data-ob="all" aria-pressed="${ui.ownerBranch==="all"}">All</button>${S.branches.map(b=>`<button class="chip" data-ob="${b.id}" aria-pressed="${ui.ownerBranch===b.id}">${esc(b.name)}</button>`).join("")}</div></div>
  <div class="kpis">
    <div class="card kpi"><div class="eyebrow">Sales today</div><div class="v">${peso(cash+gcash)}</div><div class="s">Cash ${peso(cash)} · GCash ${peso(gcash)}</div></div>
    <div class="card kpi"><div class="eyebrow">Loads today</div><div class="v">${loads.length}</div><div class="s">${running} of ${total} machines running now</div></div>
    <div class="card kpi"><div class="eyebrow">Received today</div><div class="v">${Math.round(kg*10)/10} kg</div><div class="s">${S.orders.filter(o=>inB(o)&&isToday(o.createdAt)).length} drop-off jobs</div></div>
    <div class="card kpi"><div class="eyebrow">Ready, not claimed</div><div class="v">${ready.length}</div><div class="s">${peso(ready.filter(o=>!o.paidAt).reduce((a,o)=>a+o.total,0))} still to collect</div></div>
  </div>
  <div class="dash">
    <section class="card"><div class="screen-head" style="margin-bottom:4px"><h3>Loads per machine today</h3><div class="legend" style="margin:0">${cats().map(c=>`<span><span style="color:${catColor(c.id)}">■</span> ${esc(c.name)}</span>`).join("")}</div></div>
      ${ids.filter(bid => !isSimple(bid)).length ? "" : '<p class="muted" style="margin:0">All selected branches are in simple mode, so machines aren\'t tracked.</p>'}
      ${ids.filter(bid => !isSimple(bid)).map(bid => { const ms = branchMachines(bid); const bar = m => { const n = loads.filter(l=>l.machine===m.id).length; return `<div class="bar" style="--barc:${catColor(m.type)}"><span class="mono">${m.label}</span><span class="track"><span class="fill" style="display:block;width:${n/max*100}%"></span></span><span class="n">${n}</span></div>`; };
        return `<div class="branch-block">${ids.length>1?`<div class="eyebrow">${esc(B(bid).name)} · ${loads.filter(l=>l.branch===bid).length} loads</div>`:""}
          <div class="mcols">${cats().map(c => `<div class="bars">${ms.filter(m=>m.type===c.id).map(bar).join("")}</div>`).join("")}</div></div>`; }).join("")}
    </section>
    <div class="stack" style="gap:18px">
      <section class="card"><h3 style="margin-bottom:10px">Needs attention</h3><div class="alerts">${alerts.length ? alerts.map(([k,t])=>`<div class="alert ${k}"><span class="ic"></span><span>${t}</span></div>`).join("") : '<span class="muted">All clear.</span>'}</div></section>
      <section class="card"><h3 style="margin-bottom:4px">Stock counts</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Green: full count today or yesterday. Orange: one closing missed. Red: two or more. Tap a branch for every count.</p>
        <div class="sync-list">${ids.map(bid => { const cs = countStatus(bid), extra = [cs.full && countMismatches(cs.full).length ? `${countMismatches(cs.full).length} mismatch` : "", cs.today.some(c=>c.partial) ? `${cs.today.filter(c=>c.partial).length} spot check today` : ""].filter(Boolean).join(" · "); return `<button class="count-row" data-counthist="${bid}" aria-label="Stock counts at ${esc(B(bid).name)}"><span>${esc(B(bid).name)}${extra?`<br><small class="muted">${extra}</small>`:""}</span><span class="pill ${cs.k}">${cs.label}</span></button>`; }).join("")}</div></section>
      <section class="card"><h3 style="margin-bottom:10px">Branch tablets</h3><div class="sync-list">${S.branches.map(b => { const old = Date.now()-S.lastSync[b.id] > 30*MIN; return `<div><span>${esc(b.name)}${b.simple?' <span class="pill plain simple-pill">Simple</span>':""}</span><span class="pill ${old?"warn":"good"}">${old?"Offline · "+ago(S.lastSync[b.id]):"Synced "+ago(S.lastSync[b.id])}</span></div>`; }).join("")}</div></section>
      <section class="card"><h3>BIR sales report</h3><p class="muted" style="margin:4px 0 12px">Daily sales by branch and payment method, in the Excel layout she uses now.</p><button class="btn ink block" data-export>Export to Excel</button></section>
    </div>
  </div>`;
}
