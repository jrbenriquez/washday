{% extends 'base.html' %}{% block title %}Add supply type{% endblock %}{% block content %}<div class="stub-wrap card stack"><h2>Add supply type</h2>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form data-action-dialog class="stack" method="post">{% csrf_token %}<label class="field">Name<input name="name" maxlength="120" required></label><label class="field">Unit<input name="unit" maxlength="30" required></label><label class="field">Low level<input type="number" min="0" step="0.001" name="low_level" required></label><label class="field">Used per washer load<input type="number" min="0" step="0.001" name="per_washer_load" required></label><label class="field">Used per packed job<input type="number" min="0" step="0.001" name="per_packed_job" required></label><button class="btn primary">Add supply</button><a class="button-link" href="{% url 'supplies' %}">Back to Supplies</a></form></div>{% endblock %}
