{% extends 'base.html' %}{% block title %}Next stage{% endblock %}{% block content %}<div class="stub-wrap card stack"><h2>Move job #{{ job.number }}</h2><p class="error" role="alert">{{ error }}</p><p>Start a machine from this job’s next-stage action. If no machine is used, record why.</p><form method="post" action="{% url 'advance' job.number %}" class="stack">{% csrf_token %}<input type="hidden" name="expected" value="{{ job.status_id }}"><label class="field">Reason for no machine recorded<textarea name="skip_reason" required></textarea></label><button class="btn primary">Move without a machine</button><a class="button-link" href="{% url 'board' %}">Back to Jobs</a></form></div>{% endblock %}
