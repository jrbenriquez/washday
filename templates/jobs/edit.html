{% extends 'base.html' %}{% block title %}Correct stage{% endblock %}{% block content %}<div class="stub-wrap card stack"><h2>Correct job #{{ job.number }}</h2><p>Currently {{ job.status.name }}. This correction leaves any running machine load unchanged.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="stack">{% csrf_token %}<input type="hidden" name="expected" value="{{ job.status_id }}"><label class="field">Stage<select name="target">{% for stage in stages %}<option value="{{ stage.id }}" {% if stage.id == job.status_id %}selected{% endif %}>{{ stage.name }}</option>{% endfor %}</select></label><label class="field">Reason (optional)<textarea name="reason"></textarea></label><button class="btn primary">Save stage</button><a class="button-link" href="{% url 'board' %}">Back to Jobs</a></form></div>{% endblock %}
