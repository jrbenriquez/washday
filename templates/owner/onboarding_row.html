<div class="onboarding-row" data-onboarding-row>
{% for field in form.hidden_fields %}{{ field }}{{ field.errors }}{% endfor %}
<div class="onboarding-row-fields" data-row-fields>
{% for field in form.visible_fields %}{% if field.name != 'DELETE' %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endif %}{% endfor %}
{{ form.non_field_errors }}
</div>
<span class="onboarding-removed-summary" data-removed-summary hidden></span>
<div class="onboarding-row-action"><label class="onboarding-delete-fallback">{{ form.DELETE }} Remove</label><button class="onboarding-remove" type="button" data-remove-row hidden aria-label="Remove {{ form.name.value|default:'item' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><span data-undo-label hidden>Undo</span></button></div>
</div>
